
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeraBox Downloader</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(110deg, #091b37, #173f79);
}

.container {
  width: 100%;
  max-width: 650px;
  padding: 27px 28px 35px;
  text-align: center;
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 19px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

h1 {
  margin: 0 0 18px;
  font-size: 32px;
  color: #55b9ff;
}

.subtitle { margin-bottom: 28px; }

input[type="url"] {
  width: 100%;
  padding: 16px;
  border: 1px solid #b8d2f5;
  border-radius: 10px;
  font-size: 15px;
  background: #f8fbff;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #1685f9;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #0872df; }
button:disabled { opacity: 0.6; cursor: wait; }

.section-title {
  margin: 28px 0 12px;
  font-size: 16px;
  color: #b9ddff;
}

.upload-box {
  padding: 18px;
  border: 1px dashed #8fcaff;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
}

input[type="file"] {
  width: 100%;
  color: white;
  margin: 10px 0;
}

#status {
  margin-top: 20px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

#result {
  display: none;
  margin-top: 25px;
}

video {
  width: 100%;
  max-height: 360px;
  background: black;
  border-radius: 12px;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 15px;
}

.actions button { flex: 1; }

.download { background: #16a34a; }
.download:hover { background: #12823c; }

.note {
  margin-top: 21px;
  font-size: 12px;
  line-height: 1.6;
}

@media(max-width: 500px) {
  .container { padding: 25px 18px; }
  h1 { font-size: 27px; }
  .actions { flex-direction: column; }
}
</style>
</head>

<body>

<div class="container">

  <h1>TeraBox Downloader</h1>

  <p class="subtitle">
    Paste a direct video link or select your own video.
  </p>

  <input
    type="url"
    id="videoLink"
    placeholder="Paste video link here"
  >

  <button id="convertBtn" onclick="convertVideo()">
    Load Video Link
  </button>

  <div class="section-title">OR</div>

  <div class="upload-box">
    <strong>Select Video From Your Device</strong>
    <input
      type="file"
      id="videoFile"
      accept="video/mp4,video/webm,video/ogg"
    >
  </div>

  <div id="status"></div>

  <div id="result">
    <video id="videoPlayer" controls playsinline></video>

    <div class="actions">
      <button onclick="playVideo()">▶ Play</button>
      <button class="download" onclick="downloadVideo()">
        ↓ Download
      </button>
    </div>
  </div>

  <p class="note">
    Use only videos you own or have permission to access.
    TeraBox share-link conversion is not connected yet.
    Selected files play locally in your browser.
  </p>

</div>

<script>
const API_URL =
  "https://terabox-downloader-1b8z.onrender.com/api/video";

let currentVideoUrl = "";
let currentFileName = "";
let localObjectUrl = "";

const player = document.getElementById("videoPlayer");
const result = document.getElementById("result");
const statusBox = document.getElementById("status");

function showVideo(url, message, fileName = "") {
  player.src = url;
  currentVideoUrl = url;
  currentFileName = fileName;
  result.style.display = "block";
  statusBox.textContent = message;
}

document.getElementById("videoFile")
.addEventListener("change", function() {
  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("video/")) {
    statusBox.textContent = "Please select a video file.";
    return;
  }

  if (localObjectUrl) {
    URL.revokeObjectURL(localObjectUrl);
  }

  localObjectUrl = URL.createObjectURL(file);

  showVideo(
    localObjectUrl,
    "Your video is ready to play!",
    file.name
  );
});

async function convertVideo() {
  const link = document.getElementById("videoLink")
    .value.trim();

  const button = document.getElementById("convertBtn");

  if (!link) {
    statusBox.textContent = "Please enter a video link.";
    return;
  }

  let parsed;

  try {
    parsed = new URL(link);

    if (parsed.protocol !== "https:") {
      throw new Error();
    }
  } catch {
    statusBox.textContent = "Please enter a valid HTTPS link.";
    return;
  }

  button.disabled = true;
  button.textContent = "Processing...";
  statusBox.textContent = "Please wait...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url: parsed.href })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Request failed");
    }

    const videoUrl = new URL(data.videoUrl);

    if (videoUrl.protocol !== "https:") {
      throw new Error("Invalid video URL");
    }

    if (!/\.(mp4|webm|ogg)$/i.test(videoUrl.pathname)) {
      throw new Error(
        "This is not a direct video link. TeraBox conversion is not connected."
      );
    }

    if (localObjectUrl) {
      URL.revokeObjectURL(localObjectUrl);
      localObjectUrl = "";
    }

    showVideo(videoUrl.href, "Direct video link loaded!");

  } catch (error) {
    statusBox.textContent =
      error.message || "Unable to load video.";
  } finally {
    button.disabled = false;
    button.textContent = "Load Video Link";
  }
}

function playVideo() {
  player.play().catch(() => {
    statusBox.textContent = "Unable to play this video.";
  });
}

function downloadVideo() {
  if (!currentVideoUrl) return;

  const link = document.createElement("a");
  link.href = currentVideoUrl;
  link.download = currentFileName || "video";
  link.target = "_blank";
  link.rel = "noopener";
  link.click();
}
</script>

</body>
</html>
